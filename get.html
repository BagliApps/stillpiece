<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillpiece</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<script>
// Paylaşım bağlantısı. iPhone/iPad: önce uygulamayı açmayı dener (stillpiece://),
// açılmazsa App Store'a gider. Android: Play'de yayına çıkınca (ANDROID_LIVE)
// Google Play'e, o zamana dek siteye. Diğerleri siteye.
(function () {
  var ANDROID_LIVE = false;
  var STORE = "https://apps.apple.com/app/id6824636510";
  var PLAY = "https://play.google.com/store/apps/details?id=com.alperbagli.stillpiece";
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var left = false;
  function gone() { left = true; }
  // Uygulama açılırsa (ya da iOS onay penceresi çıkarsa) sayfa gizlenir/odağı kaybeder.
  document.addEventListener("visibilitychange", function () { if (document.hidden) gone(); });
  window.addEventListener("pagehide", gone);
  window.addEventListener("blur", gone);
  function store() { if (!left) location.replace(ios ? STORE : android && ANDROID_LIVE ? PLAY : "index.html"); }
  if (ios || android) {
    // Gizli çerçeve iOS'ta çalışmıyor; yönlendirme gerekiyor.
    location.href = "stillpiece://open";
    setTimeout(store, 2000);
  } else {
    location.replace("index.html");
  }
})();
</script>
</head>
<body>
<main>
<p><a href="stillpiece://open">Stillpiece</a> · <a href="https://apps.apple.com/app/id6824636510">App Store</a> · <a href="index.html">Stillpiece</a></p>
</main>
</body>
</html>
